name: windows

# Windows 适配验证: 单元测试(跨平台逻辑) + tkinter/悬浮窗冒烟。
# macOS 侧测试由本地跑 (tests/main.swift 需 Swift 编译, 不在本 workflow 范围)。

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (providers + win_monitor logic)
        run: python -m unittest tests.test_providers tests.test_win_monitor -v

      - name: Smoke (tkinter window + win_monitor mapping)
        run: python tests/ci_smoke.py
